        // 1. Renderizar Opciones de Categorías
        function renderCategories() {
            const defaultOption = document.createElement('option');
            defaultOption.value = "Todas";
            defaultOption.textContent = "Todas las categorías";
            categorySelect.appendChild(defaultOption);

            categories.forEach(cat => {
                const opt = document.createElement('option');

            });

                    <h3 class="text-sm font-bold text-gray-900 leading-snug mb-4 flex-1 line-clamp-2">${p.nombre}</h3>
                    
                    <!-- Precios -->
                    <div class="w-full mt-auto pt-4 border-t border-gray-100 flex flex-col">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded">Precio especial</span>
                            <span class="text-xs text-gray-400">Cod: ${p.codigo}</span>
                        </div>
                        <div class="flex items-baseline gap-1 mt-1">
                            <span class="text-3xl font-extrabold text-mirna-red">$${priceFormatted}</span>
                            <span class="text-xs font-semibold text-gray-500">USD</span>
                        </div>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // 3. Lógica para filtrar por categoría
        function handleFilter() {
            const category = categorySelect.value;
            const term = searchInput.value.toLowerCase();
            filterAndSearch(category, term);
        }

        // 4. Lógica para buscar por nombre o código
        function handleSearch() {
            const category = categorySelect.value;
            const term = searchInput.value.toLowerCase();
            filterAndSearch(category, term);
        }

        function filterAndSearch(category, term) {
            let filtered = productsData;
            
            if (category !== "Todas") {
                filtered = filtered.filter(p => p.categoria === category);
            }
            
            if (term.trim() !== "") {
                filtered = filtered.filter(p => 
                    p.nombre.toLowerCase().includes(term) || 
                    p.codigo.includes(term)
                );
            }
            
            renderProducts(filtered);
        }

        // 5. Descargar a PDF (ignorando nav)
        function downloadPDF() {
            const element = document.getElementById('catalog-content');
            const opt = {
                margin:       10,
                filename:     'Catalogo_PreciosEspeciales_Mirna_B2B.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#f4f6f9' },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(element).save();
        }

        // Inicializar la app
        renderCategories();
        renderProducts(productsData);

    </script>
</body>
</html>
