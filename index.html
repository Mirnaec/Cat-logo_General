<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catálogo Mirna B2B</title>
  
  <!-- Aquí llamamos a los estilos -->
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Librería para el PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <header class="no-print">
    <div class="top">
      <div class="brand">
        <h1>Catálogo Almacenes Mirna</h1>
        <p>Ventas B2B · Precios al por mayor</p>
      </div>
      <input id="search" placeholder="Buscar producto o código..." />
      <select id="category"><option value="">Todas las categorías</option></select>
      <select id="marcacion" style="display:none;"><option value="">Todas las marcaciones</option></select>
      <button id="pdf">⬇ Descargar PDF</button>
    </div>
  </header>

  <main id="catalog">
    <section class="hero">
      <h2>CATÁLOGO</h2>
      <p>Precios Especiales</p>
      <div class="stats"><span class="pill" id="count">0 productos</span></div>
    </section>
    
    <div id="grid" class="grid"></div>
  </main>

  <!-- Aquí llamamos a tu lógica JavaScript -->
  <script src="script.js"></script>
</body>
</html>
